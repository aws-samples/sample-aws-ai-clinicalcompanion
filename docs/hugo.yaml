baseURL: https://aws-samples.github.io/sample-aws-ai-clinicalcompanion/
title: AWS ClinicalCompass
languageCode: en-gb

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Installation
      pageRef: /docs/installation
      weight: 2
    - identifier: github
      name: GitHub
      url: https://github.com/aws-samples/sample-aws-ai-clinicalcompanion
      weight: 3
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayPoweredBy: true
  imageZoom:
    enable: true
